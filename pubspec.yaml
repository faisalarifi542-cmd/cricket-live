name: cricpro_flutter
version: 2.0.0+1
publish_to: 'none'
description: Premium responsive CRICPRO cricket live score and streaming UI for Android and iPhone.

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  video_player: ^2.9.2
  google_mobile_ads: ^8.0.0
  onesignal_flutter: ^5.5.6
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
